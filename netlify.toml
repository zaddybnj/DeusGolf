# Static Vite site. https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: unknown paths serve the Vite entry. Real files (hashed assets,
# sw.js, manifest.webmanifest) still win because this rule is not forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fingerprinted Vite assets can stay cached. The service worker and manifest must revalidate
# so an installed PWA picks up a new deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
