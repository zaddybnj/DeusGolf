# Static Vite site. https://docs.netlify.com/configure-builds/file-based-configuration/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: unknown paths serve the Vite entry. Real files (hashed assets) still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
