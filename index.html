<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Preview Los Verdes GC and plan a round on your phone. Edit your bag, save hole notes, and compare the plan with your score.">
  <meta name="theme-color" content="#1f4d2b">
  <meta name="application-name" content="DeusGolf">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeusGolf">
  <title>DeusGolf</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>DeusGolf</h1>
      <span id="course"></span>
    </div>
    <div class="header-controls">
      <button id="planBtn" type="button" aria-expanded="false" aria-controls="sheet">Plan</button>
      <select id="courseSel" aria-label="Course">
        <option value="losverdes">Los Verdes</option>
        <option value="pebble">Pebble Beach (sample)</option>
      </select>
      <label class="tee">
        <select id="tee" aria-label="Tee"></select>
      </label>
    </div>
  </header>
  <button id="install" type="button" hidden>Add to Home Screen</button>
  <main>
    <div class="mapwrap">
      <canvas id="map" aria-label="Hole map. Tap to aim, drag to pan, pinch to zoom."></canvas>
      <div class="map-tools">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="fit" type="button">Fit</button>
      </div>
      <p id="noteChip" class="note-chip" hidden></p>
    </div>
    <aside>
      <div id="hole"></div>
      <div class="strategy">
        <div class="strat-row">
          <div class="miss" role="group" aria-label="Miss side">
            <span class="strat-k">Miss</span>
            <button type="button" data-miss="left">Left</button>
            <button type="button" data-miss="right">Right</button>
          </div>
          <div class="plan-step" role="group" aria-label="Plan score">
            <span class="strat-k">Plan</span>
            <button type="button" id="planMinus" aria-label="Lower plan score">−</button>
            <b id="planVal">4</b>
            <button type="button" id="planPlus" aria-label="Raise plan score">+</button>
          </div>
        </div>
        <input id="layup" maxlength="80" placeholder="Layup note" aria-label="Layup note" autocomplete="off">
      </div>
      <div class="clubs-head">
        <h3 class="clubs-label">Club</h3>
        <button id="editBag" type="button" class="text-btn">Edit bag</button>
      </div>
      <div id="clubs" role="group" aria-label="Club"></div>
      <div class="scroll-bits">
        <p id="hint" class="hint"></p>
        <div id="log" aria-live="polite"></div>
        <div id="card"></div>
        <p id="attr" class="hint"></p>
      </div>
      <div class="dock">
        <div class="nav">
          <button id="prev" type="button">Prev</button>
          <button id="reset" type="button">Replay</button>
          <button id="next" type="button">Next</button>
        </div>
        <button id="hit" class="big" type="button">Hit</button>
      </div>
    </aside>
  </main>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-bar">
        <h2 id="sheetTitle">Plan</h2>
        <button id="sheetClose" type="button">Close</button>
      </div>
      <div class="tabs" role="tablist">
        <button id="tabRounds" type="button" role="tab" aria-selected="true" aria-controls="paneRounds">Rounds</button>
        <button id="tabBag" type="button" role="tab" aria-selected="false" aria-controls="paneBag">Bag</button>
      </div>
      <div id="paneRounds" class="pane" role="tabpanel"></div>
      <div id="paneBag" class="pane" role="tabpanel" hidden></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
